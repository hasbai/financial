name: Zboard
on:
  pull_request:
  merge_group:
    types: [checks_requested]
  workflow_call:
    inputs:
      update_visual_baselines:
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      update_visual_baselines:
        description: Generate zboard visual candidates for review
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: zboard-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      zboard: ${{ steps.filter.outputs.zboard }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: filter
        run: node scripts/affected.mjs "${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}"
  full-check:
    if: github.event_name != 'pull_request'
    name: ${{ inputs.update_visual_baselines && 'zboard-candidate-check' || 'zboard-full-check' }}
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/zboard
    steps:
      - name: Zboard unchanged
        if: needs.changes.outputs.zboard != 'true'
        working-directory: .
        run: echo 'No zboard changes to check'
      - uses: actions/checkout@v4
        if: needs.changes.outputs.zboard == 'true'
      - uses: pnpm/action-setup@v4
        if: needs.changes.outputs.zboard == 'true'
      - uses: actions/setup-node@v4
        if: needs.changes.outputs.zboard == 'true'
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: needs.changes.outputs.zboard == 'true'
      - run: node ../financial/scripts/check-visual-coverage.mjs ${{ inputs.update_visual_baselines && '--candidate' || '' }}
        if: needs.changes.outputs.zboard == 'true'
      - run: pnpm typecheck
        if: needs.changes.outputs.zboard == 'true'
      - run: pnpm exec wrangler d1 migrations apply zboard --local
        if: needs.changes.outputs.zboard == 'true'
      - run: pnpm test
        if: needs.changes.outputs.zboard == 'true'
      - run: pnpm build
        if: needs.changes.outputs.zboard == 'true'
      - uses: actions/upload-artifact@v4
        if: needs.changes.outputs.zboard == 'true'
        with:
          name: zboard-production
          path: apps/zboard/dist/
  full-visual:
    if: github.event_name != 'pull_request'
    name: ${{ inputs.update_visual_baselines && 'zboard-visual-candidates' || 'zboard-full-visual' }}
    needs: changes
    runs-on: macos-26
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/zboard
    steps:
      - name: Zboard unchanged
        if: needs.changes.outputs.zboard != 'true'
        working-directory: .
        run: echo 'No zboard visual changes to check'
      - name: Require task branch for candidates
        if: needs.changes.outputs.zboard == 'true' && inputs.update_visual_baselines
        working-directory: .
        run: test "$GITHUB_REF" != refs/heads/main
      - uses: actions/checkout@v4
        if: needs.changes.outputs.zboard == 'true'
      - uses: pnpm/action-setup@v4
        if: needs.changes.outputs.zboard == 'true'
      - uses: actions/setup-node@v4
        if: needs.changes.outputs.zboard == 'true'
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: needs.changes.outputs.zboard == 'true'
      - run: pnpm exec playwright install webkit chromium
        if: needs.changes.outputs.zboard == 'true'
      - run: pnpm build
        if: needs.changes.outputs.zboard == 'true'
      - run: pnpm exec vite build --mode e2e
        if: needs.changes.outputs.zboard == 'true'
        env:
          VISUAL_COVERAGE_GATE: "1"
          DEBUG: pw:webserver
      - run: node ../financial/scripts/prepare-browser-build.mjs
        if: needs.changes.outputs.zboard == 'true'
      - run: pnpm test:e2e ${{ inputs.update_visual_baselines && '--update-snapshots=all' || '' }}
        if: needs.changes.outputs.zboard == 'true'
        env:
          VISUAL_COVERAGE_GATE: "1"
          DEBUG: pw:webserver
      - if: needs.changes.outputs.zboard == 'true' && inputs.update_visual_baselines
        run: node scripts/baselines.mjs record
      - uses: actions/upload-artifact@v4
        if: needs.changes.outputs.zboard == 'true' && inputs.update_visual_baselines
        with:
          name: zboard-visual-baseline-candidates
          path: |
            apps/zboard/e2e/__screenshots__/
            apps/zboard/test-results/visual-baseline-candidate.json
      - uses: actions/upload-artifact@v4
        if: always() && needs.changes.outputs.zboard == 'true'
        with:
          name: zboard-playwright-results
          path: |
            apps/zboard/test-results/
            apps/zboard/playwright-report/

  check-gate:
    name: zboard-check
    needs: [full-check]
    if: always() && (!inputs.update_visual_baselines)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api "repos/$GITHUB_REPOSITORY/rules/branches/main" > "$RUNNER_TEMP/main-rules.json"
      - env:
          CI_EVENT: ${{ github.event_name }}
          CI_RESULT: ${{ needs['full-check'].result }}
        run: node scripts/ci-queue-gate.mjs

  visual-gate:
    name: zboard-visual
    needs: [full-visual]
    if: always() && (!inputs.update_visual_baselines)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api "repos/$GITHUB_REPOSITORY/rules/branches/main" > "$RUNNER_TEMP/main-rules.json"
      - env:
          CI_EVENT: ${{ github.event_name }}
          CI_RESULT: ${{ needs['full-visual'].result }}
        run: node scripts/ci-queue-gate.mjs
