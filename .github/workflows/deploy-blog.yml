name: Deploy Blog
on:
  push:
    branches: [main]
    paths:
      - apps/blog/**
      - packages/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .github/workflows/deploy-blog.yml
permissions:
  contents: read
concurrency:
  group: deploy-blog
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/blog
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_BLOG_DEPLOY_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 5cecc63c78acf8f5473f8745f4244448
