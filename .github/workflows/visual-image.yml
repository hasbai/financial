name: Build visual CI image
on:
  workflow_dispatch:
  push:
    branches: [task/pinned-linux-visual-20260929]
    paths:
      - docker/visual-ci/Dockerfile
      - .github/workflows/visual-image.yml
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          file: docker/visual-ci/Dockerfile
          platforms: linux/arm64
          push: true
          tags: ghcr.io/hasbai/financial-visual-ci:pw1.63.0-node24-pnpm10.33.2-arm64-v1
      - run: echo "Image digest ${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
