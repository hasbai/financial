name: Check
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      update_visual_baselines:
        description: Generate candidate screenshots for this runner; review and commit the artifact separately
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test:coverage
      - run: pnpm build
      - uses: actions/upload-artifact@v4
        with:
          name: production-build
          path: dist/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/
          retention-days: 14
  visual:
    # Native macOS WebKit, same OS family/architecture as the checked-in baselines.
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install webkit chromium
      - if: github.event_name == 'workflow_dispatch' && inputs.update_visual_baselines
        run: pnpm test:e2e:update
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch' && inputs.update_visual_baselines
        with:
          name: visual-baseline-candidates
          path: e2e/__screenshots__/*-ci-*/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-results
          path: |
            playwright-report/
            test-results/
          retention-days: 14
