name: Check
on:
  # Strict PR protection requires current main plus check/visual before merge.
  # Do not repeat the same acceptance suite on the resulting main push.
  pull_request:
  workflow_dispatch:
    inputs:
      update_visual_baselines:
        description: Generate candidate screenshots for this runner; review and commit the artifact separately
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      financial: ${{ steps.filter.outputs.financial }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: filter
        run: node scripts/affected.mjs "${{ github.event.pull_request.base.sha }}"
  check:
    needs: changes
    if: needs.changes.outputs.financial == 'true'
    defaults:
      run:
        working-directory: apps/financial
    # Candidate runs must never publish the branch-protection check contexts.
    name: ${{ github.event_name == 'workflow_dispatch' && inputs.update_visual_baselines && 'candidate-check' || 'check' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:ci-tools
      - name: Check page coverage inventory
        run: pnpm check:visual-coverage ${{ github.event_name == 'workflow_dispatch' && inputs.update_visual_baselines && '--candidate' || '' }}
      - run: pnpm typecheck
      - run: pnpm test:coverage
      - run: pnpm build
      - uses: actions/upload-artifact@v4
        with:
          name: production-build
          path: apps/financial/dist/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: apps/financial/coverage/
          retention-days: 14
  visual:
    needs: changes
    if: needs.changes.outputs.financial == 'true'
    defaults:
      run:
        working-directory: apps/financial
    name: ${{ github.event_name == 'workflow_dispatch' && inputs.update_visual_baselines && 'visual-baseline-candidates' || 'visual' }}
    # Native macOS WebKit, same OS family/architecture as the checked-in baselines.
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - name: Require a task branch for candidates
        if: github.event_name == 'workflow_dispatch' && inputs.update_visual_baselines
        run: test "$GITHUB_REF" != refs/heads/main
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install webkit chromium
      - run: pnpm build
      - run: pnpm exec vite build --mode e2e
        env:
          VITE_DATA_API_URL: http://127.0.0.1:4173/test-api
      - run: node scripts/prepare-browser-build.mjs
      - if: github.event_name == 'workflow_dispatch' && inputs.update_visual_baselines
        run: pnpm test:e2e:update
        env:
          VISUAL_COVERAGE_GATE: '1'
      # Candidates are reviewed/imported before ordinary PR/main comparison.
      # Run exactly one browser suite per job; never update in normal CI.
      - if: github.event_name != 'workflow_dispatch' || !inputs.update_visual_baselines
        run: pnpm test:e2e
        env:
          VISUAL_COVERAGE_GATE: '1'
      - if: github.event_name == 'workflow_dispatch' && inputs.update_visual_baselines
        run: node scripts/visual-baselines.mjs record
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch' && inputs.update_visual_baselines
        with:
          name: visual-baseline-candidates
          path: |
            apps/financial/e2e/__screenshots__/*-ci-*/
            apps/financial/test-results/visual-baseline-candidate.json
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-results
          path: |
            apps/financial/playwright-report/
            apps/financial/test-results/
          retention-days: 14

  blog-candidates:
    if: github.event_name == 'workflow_dispatch' && inputs.update_visual_baselines
    uses: ./.github/workflows/blog.yml
    with:
      update_visual_baselines: true
